name: cord

# Bundled frontend, API foundation, and development database.
# Add compose.dev.yaml explicitly for the separate Vite development service.
services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cord}:${POSTGRES_PASSWORD:-cord}@postgres:5432/${POSTGRES_DB:-cord}
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cord}:${POSTGRES_PASSWORD:-cord}@postgres:5432/${POSTGRES_DB:-cord}
      # Explicit file-origin allowance for the local Electron preview; remove for public hosting.
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS-null}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cord}
      POSTGRES_USER: ${POSTGRES_USER:-cord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cord}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
